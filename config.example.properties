# Copy to config.properties and fill in. Environment variables override these values.
# SMN_CONFIG_FILE=/path/to/other.properties to use another path.

mail.smtp.host=smtp-relay.brevo.com
mail.smtp.user=your-smtp-login@smtp-brevo.com
# Plaintext or ENC1:... (AES-GCM; see SETUP). Encrypted values need SMN_MASTER_PASSWORD at runtime.
mail.smtp.password=your-smtp-key
mail.from=verified-sender@example.com

# Comma-separated recipients (order preserved). First address is primary To with the rest.
mail.to=you@hotmail.com,you@gmail.com

# Optional — same weather text as email, via Telegram Bot API
# telegram.bot.token=123456789:AAH…   (from @BotFather only — do not prefix "bot")
# telegram.chat.ids=<your numeric user id — not a bot id; message @userinfobot or your bot then getUpdates>
# Extra chats for those links (merged on each send; no restart): /subscribe current and /unsubscribe current add or
# remove the sender's chat_id in a file next to config (default smn-telegram-conditions-subscriber-chats.txt). Use
# /subscribe current day-schedule to store that chat with an overnight quiet window (no condition Telegram 00:00–05:59
# America/Argentina/Buenos_Aires). /subscribe current locs 4864,10821 — only those SMN location ids (omitting locs = same
# list as smn.location.ids in config). /subscribe current locs all (or default) clears a loc filter. Override:
# telegram.conditions.subscriber.chats.file=/path/to/extra-chats.txt
# Env: SMN_TELEGRAM_CONDITIONS_SUBSCRIBER_FILE
# Optional — forecast bulletins: either only different chat ids (same bot), or a second bot:
# telegram.forecast.chat.ids=…
# telegram.forecast.bot.token=987654321:AAH…   (env TELEGRAM_FORECAST_BOT_TOKEN). Requires telegram.forecast.chat.ids.
# Optional — measures summaries (daily/weekly/monthly) to a dedicated bot + chat id(s) (numeric, not @username):
# telegram.summaries.bot.token=…
# telegram.summaries.chat.ids=…
# Env: TELEGRAM_SUMMARIES_BOT_TOKEN, TELEGRAM_SUMMARIES_CHAT_IDS (or only chat ids → uses telegram.bot.token).
# Env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS, TELEGRAM_FORECAST_BOT_TOKEN, TELEGRAM_FORECAST_CHAT_IDS.
# Optional — slash commands on a dedicated bot (long-poll getUpdates; e.g. /hello → replies world!):
# telegram.commands.bot.token=…   (env TELEGRAM_COMMANDS_BOT_TOKEN). No chat ids needed.
# Optional — /current <texto>: same georef search as smn.gob.ar/pronostico; replies via a second bot:
# telegram.current.bot.token=…   (env TELEGRAM_CURRENT_BOT_TOKEN). User must /start that bot too.
# One-shot CLI (no mail loop), from project dir after mvn package:
#   • ./run.sh current=Salta   (run.sh resolves newest target/smn-weather-mail-*.jar; do not quote the glob yourself)
#   • ./run.sh extreme   (or add extreme, tiepre-extrema — one-shot tiepre extrema send; needs tiepre.extrema.enabled)
#   • JAR=$(ls -t target/smn-weather-mail-*.jar | head -n1); java -cp "$JAR:target/lib/*" ar.gob.smn.weather.WeatherMailApplication current=Salta
#   • java -Dcurrent=Salta -jar target/smn-weather-mail-<version>.jar   (use exact jar name; -jar uses manifest Class-Path: lib/)
# Bash: "target/smn-weather-mail-*.jar" inside quotes does NOT expand — main class will not be found.

# Optional — one Telegram at process start (HTML: bold labels). Does NOT use telegram.chat.ids unless you opt in:
#   • telegram.startup.chat.ids (or TELEGRAM_STARTUP_CHAT_IDS) — same or different ids; bot from
#     telegram.startup.bot.token / TELEGRAM_STARTUP_BOT_TOKEN, or reuse telegram.bot.token when only startup chats are set.
#   • OR telegram.startup.use.main.chats=true / TELEGRAM_STARTUP_USE_MAIN_CHATS=1 — reuse telegram.bot.token + telegram.chat.ids.
# Content: App started, version from the jar, host, última fila en forecast-day-snapshots.log, último boletín CABA en
# smn-forecast-sent.txt, última obs. enviada por correo por estación, clave VALIDATION|hoy.
# telegram.startup.bot.token=123456789:AAH…
# telegram.startup.chat.ids=…
# telegram.startup.use.main.chats=true
# Env: TELEGRAM_STARTUP_BOT_TOKEN, TELEGRAM_STARTUP_CHAT_IDS, TELEGRAM_STARTUP_USE_MAIN_CHATS.

# Optional — each ART hour from :30 onward (main poll loop): read SMN open-data tiepre (same text as /current before georef;
# SMN serves tiepre as text/plain;charset=iso-8859-1 — decoded accordingly), find max/min temperature and strongest
# numeric wind among rows not in the skip list. Skipped stations can also be listed in the message (temp/wind per
# station) — see tiepre.extrema.exclude.stations.in.message. Telegram and/or HTML email. If the snapshot matches the
# previous run (SHA-256 fingerprint in state file), nothing is sent. Default
# state file: smn-tiepre-extrema-state.txt (override with SMN_TIEPRE_EXTREMA_STATE_FILE).
# Daily 08:00 ART summary: aggregates the previous Buenos Aires day's hourly extrema rows (from
# SMN_TIEPRE_EXTREMA_HISTORY_DIR, default ./smn-tiepre-extrema-history with YYYY/MM/<day>.txt files written by the
# hourly job) into a single message with the absolute max temp, min temp and max wind, each labelled with the station
# (location) and observation time. Same Telegram routing as the hourly job (telegram.tiepre.extrema.*) and the same
# email toggle (tiepre.extrema.email). Dedupe in SMN_TIEPRE_EXTREMA_DAILY_SENT_FILE
# (default smn-tiepre-extrema-daily-sent.txt; key TIEPRE_DAILY|YYYY-MM-DD). On startup after 08:00 ART, the daily
# summary catches up if the previous day's key is missing.
# tiepre.extrema.enabled=true
# telegram.tiepre.extrema.bot.token=123456789:AAH…
# telegram.tiepre.extrema.chat.ids=<numeric chat id>
# tiepre.extrema.email=true
# Comma-separated station names excluded from the extrema ranking (identity match like /current: accents, NFC/NFD).
# Omit the key for defaults: Base Marambio, Base Belgrano II, Base Belgrano, Base Esperanza, Base San Martín, Base Carlini.
# tiepre.extrema.exclude.stations=   (empty) = exclude none from ranking. Example override:
# tiepre.extrema.exclude.stations=Base Marambio, Base Esperanza, Base Carlini
# If false, excluded locations are not shown in Telegram/email (only removed from min/max/wind). Default true. Does not
# change the dedupe fingerprint.
# tiepre.extrema.exclude.stations.in.message=false
# Env: TIEPRE_EXTREMA_EXCLUDE_STATIONS (if set, replaces file; empty env = exclude none)
# Env: TIEPRE_EXTREMA_EXCLUDE_STATIONS_IN_MESSAGE, TIEPRE_EXTREMA_ENABLED, TIEPRE_EXTREMA_EMAIL,
# TELEGRAM_TIEPRE_EXTREMA_BOT_TOKEN, TELEGRAM_TIEPRE_EXTREMA_CHAT_IDS
# (or only chat ids → uses telegram.bot.token).
# One-shot CLI (same send as the hourly job, but dedupe is skipped so a message is always attempted): java -Dextreme=true -cp … WeatherMailApplication

# Optional — shown at the bottom of condition email/Telegram as (hostname). Env SMN_REPORT_HOST overrides.
# smn.report.host=my-fly-app.internal

# Optional — which SMN weather locations to poll (conditions mail) and in what order; same list primes ws1 for /current
# and the one-shot "current=…" CLI. Comma-separated ids (e.g. CABA + Aeroparque: 4864,10821). Default when unset: 4864,10821.
# smn.location.ids=4864,10821
# Env SMN_LOCATION_IDS overrides this file (same format).

# Optional — HTTP Cookie header for ws1.smn.gob.ar (Cloudflare / sesión del sitio). If /current or polling gets HTTP 401
# for some locations, open https://www.smn.gob.ar/pronostico in a browser, DevTools → Network → any request → copy the
# full Cookie value, then set below or env SMN_WS_COOKIES (semicolon-separated name=value pairs).
# smn.ws.cookies=__cf_bm=…; cf_clearance=…

# Optional — same layout as smn-measures: YYYY/MM/yyyy-MM-dd.txt (env SMN_FORECAST_HISTORY_DIR, default ./smn-forecast-history).
# Daily 08:00 ART (CABA): compares yesterday’s measures vs every SMN JSON snapshot in forecast-day-snapshots.log that included that day; dedupe env SMN_FORECAST_VALIDATION_SENT_FILE (default smn-forecast-validation-sent.txt).
# Optional — send that report on a dedicated bot: telegram.validation.bot.token + telegram.validation.chat.ids (env TELEGRAM_VALIDATION_BOT_TOKEN, TELEGRAM_VALIDATION_CHAT_IDS). If omitted, uses telegram.bot.token + telegram.chat.ids.
# Monthly (ART): on/after 1st, zip month (now−2) from smn-measures + smn-forecast-history YYYY/MM/, remove those dirs. Env: SMN_HISTORICAL_ARCHIVE_STATE_FILE, SMN_HISTORICAL_ARCHIVE_ZIP_DIR.

# Optional
# mail.smtp.port=587
# mail.smtp.starttls=true
# mail.smtp.ssl=false
