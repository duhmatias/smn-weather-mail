# Copy to config.properties and fill in. Environment variables override these values.
# SMN_CONFIG_FILE=/path/to/other.properties to use another path.

mail.smtp.host=smtp-relay.brevo.com
mail.smtp.user=your-smtp-login@smtp-brevo.com
# Plaintext or ENC1:... (AES-GCM; see SETUP). Encrypted values need SMN_MASTER_PASSWORD at runtime.
mail.smtp.password=your-smtp-key
mail.from=verified-sender@example.com

# Comma-separated recipients (order preserved). First address is primary To with the rest.
mail.to=you@hotmail.com,you@gmail.com

# Optional — same weather text as email, via Telegram Bot API
# telegram.bot.token=123456789:AAH…   (from @BotFather only — do not prefix "bot")
# telegram.chat.ids=<your numeric user id — not a bot id; message @userinfobot or your bot then getUpdates>
# Optional — forecast bulletins: either only different chat ids (same bot), or a second bot:
# telegram.forecast.chat.ids=…
# telegram.forecast.bot.token=987654321:AAH…   (env TELEGRAM_FORECAST_BOT_TOKEN). Requires telegram.forecast.chat.ids.
# Optional — measures summaries (daily/weekly/monthly) to a dedicated bot + chat id(s) (numeric, not @username):
# telegram.summaries.bot.token=…
# telegram.summaries.chat.ids=…
# Env: TELEGRAM_SUMMARIES_BOT_TOKEN, TELEGRAM_SUMMARIES_CHAT_IDS (or only chat ids → uses telegram.bot.token).
# Env: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_IDS, TELEGRAM_FORECAST_BOT_TOKEN, TELEGRAM_FORECAST_CHAT_IDS.
# Optional — slash commands on a dedicated bot (long-poll getUpdates; e.g. /hello → replies world!):
# telegram.commands.bot.token=…   (env TELEGRAM_COMMANDS_BOT_TOKEN). No chat ids needed.

# Optional — shown at the bottom of condition email/Telegram as (hostname). Env SMN_REPORT_HOST overrides.
# smn.report.host=my-fly-app.internal

# Optional — same layout as smn-measures: YYYY/MM/yyyy-MM-dd.txt (env SMN_FORECAST_HISTORY_DIR, default ./smn-forecast-history).
# Daily 08:00 ART (CABA): compares yesterday’s measures vs earliest SMN JSON logged in forecast-day-snapshots.log; dedupe file env SMN_FORECAST_VALIDATION_SENT_FILE (default smn-forecast-validation-sent.txt).
# Monthly (ART): on/after 1st, zip month (now−2) from smn-measures + smn-forecast-history YYYY/MM/, remove those dirs. Env: SMN_HISTORICAL_ARCHIVE_STATE_FILE, SMN_HISTORICAL_ARCHIVE_ZIP_DIR.

# Optional
# mail.smtp.port=587
# mail.smtp.starttls=true
# mail.smtp.ssl=false
